name: Deploy Demo & Docs

# paths: 사이트 산출물(react demo + docs + vue demo)의 빌드 입력만 나열한다.
# docs/** 전체가 아닌 사이트 빌드 하위 경로만 — 워크로그·캠페인·리포트 등 문서성 push로
# Pages 재배포가 낭비되지 않도록. 필터로 스킵된 뒤 수동 재배포는 workflow_dispatch로.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'docs/.vitepress/**'
      - 'docs/components/**'
      - 'docs/ko/**'
      - 'docs/index.md'
      - 'docs/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and demo
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build

      - name: Compose site (react demo at root + docs at /docs + vue demo at /vue)
        run: |
          rm -rf site
          mkdir -p site/docs
          mkdir -p site/vue
          cp -R examples/react-example/dist/. site/
          cp -R docs/.vitepress/dist/. site/docs/
          cp -R examples/vue-example/dist/. site/vue/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
